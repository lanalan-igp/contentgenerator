<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0efe9;color:#1a1a1a;font-size:13px}
.header{background:#0e1117;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7ba7c4;gap:12px}
.hlogo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#hdr-logo{display:flex;align-items:center}
#hdr-logo img{height:28px;max-width:190px;object-fit:contain;display:block}
.hfb{display:flex;align-items:center;gap:7px}
.hfb .in{color:#7ba7c4;font-size:18px;font-weight:900}
.hfb .gp{color:#fff;font-size:18px;font-weight:900}
.hsub{color:rgba(255,255,255,.35);font-size:9px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.ltgl{display:flex;border:1px solid rgba(255,255,255,.2);overflow:hidden;flex-shrink:0}
.ltgl button{background:transparent;color:rgba(255,255,255,.45);border:none;padding:5px 11px;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s}
.ltgl button.active{background:#7ba7c4;color:#fff}
.layout{display:grid;grid-template-columns:258px 1fr;height:calc(100vh - 46px);overflow:hidden}
.sb{background:#fff;border-right:1px solid #e0e0da;display:flex;flex-direction:column;overflow-y:auto}
.sbs{padding:11px 14px;border-bottom:1px solid #f0f0ec}
.sbh{font-size:8px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#bbb;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.sbh::before{content:'';display:block;width:12px;height:1.5px;background:#7ba7c4;flex-shrink:0}
.fg{margin-bottom:8px}
.fg label{display:block;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#bbb;margin-bottom:3px}
.fg input,.fg textarea{width:100%;border:none;border-bottom:1.5px solid #e8e8e4;padding:5px 0;font-size:12px;font-family:inherit;color:#1a1a1a;background:transparent;outline:none;transition:border-color .15s}
.fg input:focus,.fg textarea:focus{border-bottom-color:#7ba7c4}
.fg textarea{resize:vertical;min-height:46px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ubl{display:inline-flex;align-items:center;gap:5px;border:1px dashed #ccc;padding:5px 9px;cursor:pointer;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;transition:border-color .15s}
.ubl:hover{border-color:#7ba7c4;color:#7ba7c4}
.rmb{font-size:9px;color:#ccc;background:none;border:none;cursor:pointer;padding:0;letter-spacing:1px;text-transform:uppercase;margin-left:8px}
.bgen{width:100%;background:#0e1117;color:#fff;border:none;padding:10px;font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.bgen:hover{background:#7ba7c4}
.bgen:disabled{opacity:.35;cursor:not-allowed;background:#0e1117}
.main{display:flex;flex-direction:column;overflow:hidden}
.tabs{background:#fff;border-bottom:1px solid #e0e0da;display:flex;flex-shrink:0}
.tab{padding:10px 16px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:#bbb;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:#0e1117;border-bottom-color:#7ba7c4}
.tc{display:none;flex:1;overflow:auto}
.tc.active{display:flex;flex-direction:column}
.ca{padding:12px;display:flex;flex-direction:column;gap:10px}
.rc{background:#fff;border:1px solid #e8e8e4;overflow:hidden}
.rch{background:#0e1117;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.rcl{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.rca{display:flex;gap:4px}
.rca button{background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.55);padding:3px 8px;font-size:8px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:3px}
.rca button:hover{border-color:#7ba7c4;color:#7ba7c4}
.rca button:disabled{opacity:.22;cursor:not-allowed}
.rb{width:3px;flex-shrink:0}
.rbd{padding:12px 14px;font-size:12px;line-height:1.85;color:#222;white-space:pre-wrap;word-break:break-word;min-height:68px}
.sk{background:#eee;animation:pulse 1.3s ease-in-out infinite;height:11px;margin-bottom:8px;border-radius:2px}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.ph{color:#ccc;font-size:11px;font-style:italic}
.fa{padding:12px;display:flex;flex-direction:column;gap:10px}
.fctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fctrl select{border:1px solid #ddd;padding:5px 8px;font-size:11px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;cursor:pointer}
.cb{background:#0e1117;color:#fff;border:none;padding:6px 12px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .2s;white-space:nowrap}
.cb:hover{background:#7ba7c4}
.cb:disabled{opacity:.35;cursor:not-allowed;background:#0e1117}
.cb.on{background:#7ba7c4}
.fwrap{display:flex;justify-content:center;padding-bottom:20px}
.fsc{transform-origin:top center;display:inline-block}
/* Edit mode */
#flyer.eon [data-block]{outline:1.5px dashed rgba(123,167,196,.35);cursor:grab}
#flyer.eon [data-block]:hover{outline:2px dashed #7ba7c4}
#flyer.eon [data-block].sel{outline:2px solid #7ba7c4}
#flyer.eon [data-block].drg{cursor:grabbing;opacity:.92}
/* Float toolbar */
#ftb{position:fixed;z-index:9999;background:#0e1117;border:1px solid rgba(123,167,196,.35);padding:4px 8px;display:none;align-items:center;gap:5px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#ftb button{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);padding:3px 8px;font-size:10px;cursor:pointer;transition:all .15s;font-family:inherit;font-weight:700}
#ftb button:hover{background:#7ba7c4;border-color:#7ba7c4;color:#fff}
#ftb .sp{width:1px;height:14px;background:rgba(255,255,255,.15)}
#ftb .ht{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.8px;white-space:nowrap}
/* Hint bar */
#ehbar{background:#edf4f9;border:1px solid #cde0ed;padding:7px 12px;font-size:10px;color:#5a8aa8;display:none;align-items:center;gap:7px;flex-shrink:0}
/* Toast */
.toast{position:fixed;bottom:14px;right:14px;background:#0e1117;color:#fff;padding:7px 13px;font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;border-left:3px solid #7ba7c4}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="hlogo">
    <div id="hdr-logo">
      <div style="display:flex;align-items:flex-end;gap:1px;line-height:1">
        <span style="font-size:20px;font-weight:900;color:#7ba7c4;letter-spacing:-0.5px">In</span><span style="font-size:20px;font-weight:900;color:#fff;letter-spacing:-0.5px">Genius</span><span style="font-size:10px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:2px;margin-left:4px;margin-bottom:2px">Prep</span>
      </div>
    </div>
    <span class="hsub" id="hdsub">AI 文案 + 海报生成器</span>
  </div>
  <div class="ltgl">
    <button class="active" onclick="setLang('zh')">中文</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="layout">
<!-- SIDEBAR -->
<div class="sb">
  <!-- Logo -->
  <div class="sbs">
    <div class="sbh" id="s-logo">品牌 Logo</div>
    <div id="lp" style="display:none;margin-bottom:6px"><img id="lpv" style="max-height:30px;max-width:180px;object-fit:contain;display:block"><button class="rmb" onclick="clr('logo')" id="lrmb">× 移除</button></div>
    <label for="flogo" class="ubl" id="lubl"><i class="ti ti-upload" style="font-size:12px"></i><span id="llbl">上传 Logo</span></label>
    <input type="file" id="flogo" accept="image/*" style="display:none" onchange="up('logo',this)">
  </div>
  <!-- Background -->
  <div class="sbs">
    <div class="sbh" id="s-bg">海报背景图</div>
    <div style="font-size:10px;color:#bbb;margin-bottom:7px" id="bghint">上传后将作为海报英雄区背景</div>
    <div id="bp" style="display:none;margin-bottom:6px"><img id="bpv" style="max-height:40px;max-width:200px;object-fit:cover;display:block;border:1px solid #eee"><button class="rmb" onclick="clr('bg')" id="brmb">× 移除</button></div>
    <label for="fbg" class="ubl" id="bubl"><i class="ti ti-photo" style="font-size:12px"></i><span id="blbl">上传背景图</span></label>
    <input type="file" id="fbg" accept="image/*" style="display:none" onchange="up('bg',this)">
  </div>
  <!-- Event -->
  <div class="sbs">
    <div class="sbh" id="s-ev">活动信息</div>
    <div class="fg"><label id="l-theme">活动主题 *</label><input id="ftheme" placeholder="2026申请季终极复盘会"></div>
    <div class="fg"><label id="l-kp">核心议程（每行一条）</label><textarea id="fkp" placeholder="• 拆解哈佛/耶鲁录取案例&#10;• AI筛选时代如何突围&#10;• 前招生官1v1答疑&#10;• 名校选校策略解析"></textarea></div>
    <div class="r2">
      <div class="fg"><label id="l-time">日期时间</label><input id="ftime" placeholder="5月18日 10am PST"></div>
      <div class="fg"><label id="l-loc">地点</label><input id="floc" placeholder="线上Zoom"></div>
    </div>
    <div class="r2">
      <div class="fg"><label id="l-ev">活动标签</label><input id="fevtype" placeholder="线上讲座"></div>
      <div class="fg"><label id="l-ct">联系/报名</label><input id="fcontact" placeholder="扫码报名"></div>
    </div>
  </div>
  <!-- Speaker 1 -->
  <div class="sbs">
    <div class="sbh" id="s-s1">嘉宾 1</div>
    <div style="display:flex;gap:9px;align-items:flex-start">
      <div style="flex-shrink:0">
        <div id="s1p" style="display:none;margin-bottom:5px"><img id="s1pv" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #7ba7c4;display:block"><button class="rmb" onclick="clr('s1')" style="font-size:8px">× 移除</button></div>
        <label for="fs1" class="ubl" id="s1ubl" style="flex-direction:column;align-items:center;padding:7px;min-width:50px;gap:2px"><i class="ti ti-user" style="font-size:15px"></i><span style="font-size:8px" id="s1lbl">头像</span></label>
        <input type="file" id="fs1" accept="image/*" style="display:none" onchange="up('s1',this)">
      </div>
      <div style="flex:1;min-width:0">
        <div class="fg"><label id="l-name">姓名</label><input id="fs1n" placeholder="Erin Gu"></div>
        <div class="fg"><label id="l-cred">职位与资历</label><textarea id="fs1c" placeholder="引知首席教育官&#10;哈佛大学教育学硕士" style="min-height:40px"></textarea></div>
      </div>
    </div>
  </div>
  <!-- Speaker 2 -->
  <div class="sbs">
    <div class="sbh" id="s-s2">嘉宾 2（选填）</div>
    <div style="display:flex;gap:9px;align-items:flex-start">
      <div style="flex-shrink:0">
        <div id="s2p" style="display:none;margin-bottom:5px"><img id="s2pv" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #7ba7c4;display:block"><button class="rmb" onclick="clr('s2')" style="font-size:8px">× 移除</button></div>
        <label for="fs2" class="ubl" id="s2ubl" style="flex-direction:column;align-items:center;padding:7px;min-width:50px;gap:2px"><i class="ti ti-user" style="font-size:15px"></i><span style="font-size:8px" id="s2lbl">头像</span></label>
        <input type="file" id="fs2" accept="image/*" style="display:none" onchange="up('s2',this)">
      </div>
      <div style="flex:1;min-width:0">
        <div class="fg"><label id="l-name2">姓名</label><input id="fs2n" placeholder="Zak Harris"></div>
        <div class="fg"><label id="l-cred2">职位与资历</label><textarea id="fs2c" placeholder="约翰霍普金斯大学前招生官&#10;8年以上招生经验" style="min-height:40px"></textarea></div>
      </div>
    </div>
  </div>
  <!-- Extras -->
  <div class="sbs" style="border:none">
    <div class="sbh" id="s-ex">额外信息</div>
    <div class="fg"><label id="l-ex">亮点/福利</label><input id="fex" placeholder="免费录取白皮书 · 限30名"></div>
    <div style="margin-top:10px">
      <button class="bgen" id="gbtn" onclick="genAll()">
        <i class="ti ti-sparkles" style="font-size:13px"></i><span id="gbtnlbl">一键生成文案 + 海报</span>
      </button>
    </div>
  </div>
</div><!-- /sb -->

<!-- MAIN -->
<div class="main">
  <div class="tabs">
    <div class="tab active" onclick="stab('copy',this)"><i class="ti ti-writing" style="font-size:11px;vertical-align:-2px;margin-right:3px"></i><span id="tlbl1">三版文案</span></div>
    <div class="tab" onclick="stab('flyer',this)"><i class="ti ti-photo" style="font-size:11px;vertical-align:-2px;margin-right:3px"></i><span id="tlbl2">活动海报</span></div>
  </div>

  <!-- COPY -->
  <div id="tc-copy" class="tc active">
    <div class="ca">
      <div class="rc"><div class="rch"><div style="display:flex;align-items:center;gap:7px"><span style="width:19px;height:19px;border-radius:50%;border:1.5px solid #7ba7c4;display:flex;align-items:center;justify-content:center;color:#7ba7c4;font-size:8px;font-weight:700">01</span><span class="rcl" id="sl1" style="color:#7ba7c4">知识分享</span></div><div class="rca"><button onclick="rg('knowledge')" id="rg1"><i class="ti ti-refresh" style="font-size:10px"></i><span id="rgl1"> 重新生成</span></button><button onclick="cp('knowledge')"><i class="ti ti-copy" style="font-size:10px"></i><span id="cpl1"> 复制</span></button></div></div><div style="display:flex"><div class="rb" style="background:#7ba7c4"></div><div class="rbd" id="c-knowledge"><span class="ph" id="ph1">填写信息后点击生成</span></div></div></div>
      <div class="rc"><div class="rch"><div style="display:flex;align-items:center;gap:7px"><span style="width:19px;height:19px;border-radius:50%;border:1.5px solid #c49a7b;display:flex;align-items:center;justify-content:center;color:#c49a7b;font-size:8px;font-weight:700">02</span><span class="rcl" id="sl2" style="color:#c49a7b">标题党</span></div><div class="rca"><button onclick="rg('clickbait')" id="rg2"><i class="ti ti-refresh" style="font-size:10px"></i><span id="rgl2"> 重新生成</span></button><button onclick="cp('clickbait')"><i class="ti ti-copy" style="font-size:10px"></i><span id="cpl2"> 复制</span></button></div></div><div style="display:flex"><div class="rb" style="background:#c49a7b"></div><div class="rbd" id="c-clickbait"><span class="ph" id="ph2">填写信息后点击生成</span></div></div></div>
      <div class="rc"><div class="rch"><div style="display:flex;align-items:center;gap:7px"><span style="width:19px;height:19px;border-radius:50%;border:1.5px solid #a0b89f;display:flex;align-items:center;justify-content:center;color:#a0b89f;font-size:8px;font-weight:700">03</span><span class="rcl" id="sl3" style="color:#a0b89f">简约直接</span></div><div class="rca"><button onclick="rg('minimal')" id="rg3"><i class="ti ti-refresh" style="font-size:10px"></i><span id="rgl3"> 重新生成</span></button><button onclick="cp('minimal')"><i class="ti ti-copy" style="font-size:10px"></i><span id="cpl3"> 复制</span></button></div></div><div style="display:flex"><div class="rb" style="background:#a0b89f"></div><div class="rbd" id="c-minimal"><span class="ph" id="ph3">填写信息后点击生成</span></div></div></div>
    </div>
  </div>

  <!-- FLYER -->
  <div id="tc-flyer" class="tc">
    <div class="fa">
      <div class="fctrl">
        <select id="selTheme" onchange="rf()"><option value="dark" id="o-dk">深色经典</option><option value="white" id="o-wh">白色专业</option><option value="split" id="o-sp">黑白分割</option></select>
        <select id="selPL" onchange="autoTranslate()"><option value="zh-hans">简体中文</option><option value="zh-hant">繁體中文</option><option value="en">English</option><option value="ko">한국어</option></select>
        <button class="cb" id="etbtn" onclick="toggleEdit()"><i class="ti ti-pencil" style="font-size:11px"></i><span id="etlbl"> 编辑海报</span></button>
        <button class="cb" onclick="dlPNG()" id="dlbtn"><i class="ti ti-download" style="font-size:11px"></i><span id="dllbl"> 下载 PNG</span></button>
        <button class="cb" onclick="dlHTML()" style="background:#2a2a2a"><i class="ti ti-code" style="font-size:11px"></i><span id="dlhlbl"> 下载可编辑版</span></button>
      </div>
      <!-- Zoom bar -->
      <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e8e8e4;padding:6px 12px;width:fit-content">
        <button onclick="zoom(-0.1)" style="background:transparent;border:1px solid #ddd;color:#555;width:24px;height:24px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">−</button>
        <input type="range" id="zoomSlider" min="30" max="130" value="74" step="2" oninput="setZoom(this.value/100)" style="width:110px;accent-color:#7ba7c4;cursor:pointer">
        <button onclick="zoom(0.1)" style="background:transparent;border:1px solid #ddd;color:#555;width:24px;height:24px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">+</button>
        <span id="zoomPct" style="font-size:10px;font-weight:700;color:#999;letter-spacing:1px;min-width:34px">74%</span>
        <div style="width:1px;height:14px;background:#eee"></div>
        <button onclick="setZoom(0.74)" style="font-size:9px;background:transparent;border:none;color:#bbb;cursor:pointer;letter-spacing:1px;text-transform:uppercase;padding:0">重置</button>
        <div id="translating-badge" style="display:none;align-items:center;gap:5px;margin-left:6px;background:#edf4f9;border:1px solid #cde0ed;padding:3px 9px">
          <i class="ti ti-loader" style="font-size:11px;color:#7ba7c4;animation:spin 1s linear infinite"></i>
          <span style="font-size:9px;color:#5a8aa8;font-weight:700;letter-spacing:1px" id="translating-txt">翻译中…</span>
        </div>
      </div>
      <div id="ehbar"><i class="ti ti-hand-finger" style="font-size:13px"></i><span id="ehhint">单击选择 · 拖动移位 · 双击编辑文字 · 工具栏调整大小和重置位置</span></div>
      <div class="fwrap"><div class="fsc" id="fsc" style="transform:scale(0.74)"><div id="flyer"></div></div></div>
    </div>
  </div>
</div><!-- /main -->
</div><!-- /layout -->

<!-- FLOAT TOOLBAR -->
<div id="ftb">
  <button onclick="adj(-0.12)">A-</button>
  <span id="ftsz" style="font-size:10px;color:rgba(255,255,255,.55);min-width:30px;text-align:center">100%</span>
  <button onclick="adj(0.12)">A+</button>
  <div class="sp"></div>
  <button onclick="rst()" title="重置位置">↺</button>
  <div class="sp"></div>
  <span class="ht" id="ftht">拖动 · 双击编辑</span>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* STATE */
let LD=null,BD=null,S1=null,S2=null,uL='zh',eon=false;
const BP={},SC=0.74;
let sel=null,ds=null,tData=null,zoomLvl=0.74;

function up(t,inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const d=e.target.result;
    if(t==='logo'){LD=d;document.getElementById('lpv').src=d;document.getElementById('lp').style.display='block';document.getElementById('llbl').textContent=T('rpl');document.getElementById('hdr-logo').innerHTML=`<img src="${d}" style="height:28px;max-width:190px;object-fit:contain;display:block">`;}
    else if(t==='bg'){BD=d;document.getElementById('bpv').src=d;document.getElementById('bp').style.display='block';document.getElementById('blbl').textContent=T('rpl');}
    else if(t==='s1'){S1=d;document.getElementById('s1pv').src=d;document.getElementById('s1p').style.display='block';}
    else if(t==='s2'){S2=d;document.getElementById('s2pv').src=d;document.getElementById('s2p').style.display='block';}
    rf();
  };r.readAsDataURL(f);
}

/* AUTO-TRANSLATE */
const LANG_NAMES={'zh-hans':'简体中文（Simplified Chinese）','zh-hant':'繁體中文（Traditional Chinese）','en':'English','ko':'한국어（Korean）'};
async function autoTranslate(){
  const lang=document.getElementById('selPL').value;
  if(lang==='zh-hans'){tData=null;rf();return;}
  const raw=gi(true);
  const badge=document.getElementById('translating-badge');
  const ttxt=document.getElementById('translating-txt');
  badge.style.display='flex';
  const transUI={'zh-hant':'翻譯中…','en':'Translating…','ko':'번역 중…'};
  ttxt.textContent=transUI[lang]||'翻译中…';
  try{
    const prompt=`Translate the following event poster content into ${LANG_NAMES[lang]}. Return ONLY a valid JSON object — no markdown, no explanation — with exactly these keys: th, kp, et, ct, s1c, s2c, ex, tm, lc.

Rules:
- For kp: preserve line breaks using \\n
- Keep speaker/people names untranslated
- Use natural idiomatic expressions — not literal word-for-word translation
- For Korean: use polite formal register (합쇼체) appropriate for event announcements
- For Traditional Chinese: use Taiwan conventions
- If a field is empty or just says "待定"/"待填写", translate that word too

Content:
th: ${raw.th}
kp: ${raw.kp||'（空）'}
et: ${raw.et||'线上讲座'}
ct: ${raw.ct||'扫码报名'}
s1c: ${raw.s1c||'（空）'}
s2c: ${raw.s2c||'（空）'}
ex: ${raw.ex||'（空）'}
tm: ${raw.tm||'待定'}
lc: ${raw.lc||'待定'}`;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    if(d.error)throw new Error(d.error.message);
    let txt=d.content[0].text.trim().replace(/^```json?\s*/,'').replace(/\s*```$/,'').trim();
    tData=JSON.parse(txt);
  }catch(e){
    console.error('Translation failed',e);tData=null;toast('翻译失败，显示原文');
  }
  badge.style.display='none';
  rf();
}

/* DATA — raw=true skips tData override */
function gi(raw=false){
  const base={th:document.getElementById('ftheme').value.trim()||'活动标题',kp:document.getElementById('fkp').value.trim(),tm:document.getElementById('ftime').value.trim()||'待定',lc:document.getElementById('floc').value.trim()||'待定',et:document.getElementById('fevtype').value.trim()||'线上讲座',ct:document.getElementById('fcontact').value.trim()||'扫码报名',s1n:document.getElementById('fs1n').value.trim(),s1c:document.getElementById('fs1c').value.trim(),s2n:document.getElementById('fs2n').value.trim(),s2c:document.getElementById('fs2c').value.trim(),ex:document.getElementById('fex').value.trim()};
  if(!raw&&tData){return{...base,...tData,s1n:base.s1n,s2n:base.s2n};}// keep names untranslated
  return base;
}
function ini(n){if(!n)return'IG';const p=n.replace(/[^\u4e00-\u9fa5a-zA-Z\s]/g,'').trim().split(/\s+/);return p.length>=2?(p[0][0]+(p[1][0]||'')).toUpperCase():n.slice(0,2).toUpperCase();}

function avt(ph,nm,dk){const bg=dk?'#1e2d3d':'#dce8f0';if(ph)return`<img src="${ph}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2.5px solid #7ba7c4;display:block">`;return`<div style="width:72px;height:72px;border-radius:50%;border:2.5px solid #7ba7c4;background:${bg};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#7ba7c4">${ini(nm)}</div>`;}

/* EDIT MODE */
function toggleEdit(){
  eon=!eon;
  document.getElementById('flyer').classList.toggle('eon',eon);
  document.getElementById('etbtn').classList.toggle('on',eon);
  document.getElementById('etlbl').textContent=' '+(eon?T('eon'):T('eoff'));
  document.getElementById('ehbar').style.display=eon?'flex':'none';
  if(!eon){hTB();if(sel){sel.classList.remove('sel');sel=null;}}
}

function iDrag(){
  document.getElementById('flyer').querySelectorAll('[data-block]').forEach(el=>{
    el.addEventListener('pointerdown',pDown);
    el.addEventListener('dblclick',pDbl);
    el.addEventListener('click',pClick);
  });
}

function pClick(e){if(!eon)return;const el=e.currentTarget;selB(el);e.stopPropagation();}
function pDbl(e){
  if(!eon)return;
  e.currentTarget.querySelectorAll('div,span').forEach(n=>{if(!n.querySelector('svg,img'))n.contentEditable='true';});
  e.currentTarget.style.cursor='text';
  e.stopPropagation();
}

function selB(el){
  if(sel&&sel!==el){sel.classList.remove('sel');sel.querySelectorAll('[contenteditable]').forEach(e=>{e.removeAttribute('contenteditable');e.style.cursor='';});sel.style.cursor='';}
  sel=el;el.classList.add('sel');sTB(el);
}

function sTB(el){
  const tb=document.getElementById('ftb');
  const r=el.getBoundingClientRect();
  tb.style.display='flex';
  tb.style.left=Math.max(4,r.left)+'px';
  tb.style.top=Math.max(4,r.top-40)+'px';
  const id=el.dataset.block;
  document.getElementById('ftsz').textContent=Math.round(((BP[id]||{}).s||1)*100)+'%';
}
function hTB(){document.getElementById('ftb').style.display='none';}

function adj(d){if(!sel)return;const id=sel.dataset.block;if(!BP[id])BP[id]={x:0,y:0,s:1};BP[id].s=Math.max(0.25,Math.min(3,(BP[id].s||1)+d));atr(sel,id);document.getElementById('ftsz').textContent=Math.round(BP[id].s*100)+'%';}
function rst(){if(!sel)return;const id=sel.dataset.block;BP[id]={x:0,y:0,s:1};atr(sel,id);document.getElementById('ftsz').textContent='100%';}
function atr(el,id){const{x=0,y=0,s=1}=BP[id]||{};el.style.transform=`translate(${x}px,${y}px) scale(${s})`;}

function pDown(e){
  if(!eon)return;
  if(e.target.closest('[contenteditable="true"]'))return;
  const el=e.currentTarget;const id=el.dataset.block;
  if(!BP[id])BP[id]={x:0,y:0,s:1};
  ds={el,id,sx:e.clientX,sy:e.clientY,tx:BP[id].x,ty:BP[id].y};
  el.setPointerCapture(e.pointerId);el.classList.add('drg');
  el.addEventListener('pointermove',pMove);
  el.addEventListener('pointerup',pUp,{once:true});
  e.preventDefault();
}
function pMove(e){
  if(!ds)return;
  BP[ds.id].x=ds.tx+(e.clientX-ds.sx)/SC;
  BP[ds.id].y=ds.ty+(e.clientY-ds.sy)/SC;
  atr(ds.el,ds.id);
  if(sel===ds.el)sTB(ds.el);
}
function pUp(e){if(!ds)return;ds.el.classList.remove('drg');ds.el.removeEventListener('pointermove',pMove);ds=null;}

/* COPY GEN */
const SYS=`你是一位专业的华人美本升学机构宣传文案写手，深度掌握引知InGenius Prep的写作风格。
1.知识分享风格：数据开场建立权威，问题→数据→分析→方案→活动结构，穿插A/B同学案例，信息密度高。
2.标题党风格：标题用"炸锅/疯了/变天了"等词，开篇制造"意难平"场景，感叹号+省略号，FOMO式呼吁，数据要震撼。
3.简约直接风格：emoji做视觉符号，信息结构化，语气如朋友分享干货，适合朋友圈转发。
通用：中文为主穿插GPA/SAT/RD/ED等缩写；长度：知识分享300-400字，标题党250-350字，简约150-200字；直接给正文不要前缀。`;

function bP(sty,inf){const m={knowledge:'知识分享风格：数据驱动、结构清晰',clickbait:'标题党风格：震撼标题、制造FOMO、戏剧化',minimal:'简约直接风格：emoji辅助、信息结构化、适合转发'};return`请为以下活动撰写【${m[sty]}】宣传文案：\n主题：${inf.th} | 时间：${inf.tm} | 地点：${inf.lc}\n嘉宾：${[inf.s1n,inf.s2n].filter(Boolean).join('、')||'引知升学专家'}\n议程：${inf.kp||'（未填写）'}\n亮点：${inf.ex||'无'}\n直接输出正文。`;}

function skel(id){const ws=[72,90,58,84,68,54,78];document.getElementById('c-'+id).innerHTML=ws.map(w=>`<div class="sk" style="width:${w}%"></div>`).join('');}

async function callA(sty,inf){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYS,messages:[{role:'user',content:bP(sty,inf)}]})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d.content[0].text;}

async function genAll(){
  const inf=gi();const btn=document.getElementById('gbtn');
  btn.disabled=true;document.getElementById('gbtnlbl').textContent=T('gen_');
  document.head.insertAdjacentHTML('beforeend','<style>@keyframes spin{to{transform:rotate(360deg)}}</style>');
  ['knowledge','clickbait','minimal'].forEach(s=>{skel(s);['rg1','rg2','rg3'].forEach(id=>document.getElementById(id).disabled=true);});
  rf();
  await Promise.all(['knowledge','clickbait','minimal'].map(async(s,i)=>{
    try{document.getElementById('c-'+s).textContent=await callA(s,inf);}
    catch(e){document.getElementById('c-'+s).textContent='生成失败：'+e.message;}
    document.getElementById('rg'+(i+1)).disabled=false;
  }));
  btn.disabled=false;document.getElementById('gbtnlbl').textContent=T('gen');
}

async function rg(sty){
  const inf=gi();const idx={knowledge:1,clickbait:2,minimal:3}[sty];
  document.getElementById('rg'+idx).disabled=true;skel(sty);
  try{document.getElementById('c-'+sty).textContent=await callA(sty,inf);}
  catch(e){document.getElementById('c-'+sty).textContent='生成失败：'+e.message;}
  document.getElementById('rg'+idx).disabled=false;
}

function cp(sty){
  const el=document.getElementById('c-'+sty);
  if(el.querySelector('.ph,.sk'))return;
  navigator.clipboard.writeText(el.textContent).then(()=>toast(T('copied')));
}
